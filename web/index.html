<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yap</title>
<style>
  :root { --bg:#0f1115; --card:#171a20; --card2:#1e222a; --hover:#2a3039; --line:#272c35; --fg:#e8ebf0; --dim:#8b93a1; --green:#3ddc84; --yellow:#f2c94c; --red:#ff6b6b; --blue:#6cb6ff; --ring:rgba(61,220,132,.55); --on-bg:#173226; --alarm-bg:#3a1d1d; --warn-bg:#3a2e12; --bar-bg:rgba(15,17,21,.92); color-scheme:dark }
  [data-theme=light] { --bg:#f4f6f9; --card:#ffffff; --card2:#eef1f5; --hover:#e2e6ec; --line:#d9dee6; --fg:#1b1f26; --dim:#6b7280; --green:#1a9e5b; --yellow:#b8860b; --red:#d93636; --blue:#1f6fd1; --ring:rgba(26,158,91,.45); --on-bg:#dff5e8; --alarm-bg:#fde2e2; --warn-bg:#fff3cd; --bar-bg:rgba(244,246,249,.92); color-scheme:light }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif; display:flex; flex-direction:column; overflow:hidden }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer }
  .dim { color:var(--dim) } .green { color:var(--green) } .yellow { color:var(--yellow) } .red { color:var(--red) }

  header { padding:4px 6px; display:flex; flex-wrap:wrap; gap:2px 8px; align-items:center; border-bottom:1px solid var(--line); background:var(--card); font-variant-numeric:tabular-nums }
  .pill { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); padding:1px 1px 1px 6px }
  .pill code { font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--blue) }
  .pill button { background:var(--card2); padding:1px 6px; font-size:12px } .pill button:hover { background:var(--hover) }
  footer { font-size:.8rem; padding:2px 6px; display:flex; flex-wrap:wrap; gap:2px 12px; align-items:center; border-top:1px solid var(--line); background:var(--card); color:var(--dim); font-variant-numeric:tabular-nums; white-space:pre }
  footer .pill code { font-size:.8rem } footer .pill button { font-size:.75rem; padding:0 5px }
  #quality { display:inline-flex; align-items:center; gap:5px }
  #quality i { width:8px; height:8px; background:var(--dim); display:inline-block }
  #quality i.good { background:var(--green) } #quality i.ok { background:var(--yellow) } #quality i.poor { background:var(--red) }
  #relay { min-width:14ch }
  .spacer { flex:1 }
  #gear, #theme { font-size:16px; padding:0 6px; line-height:1.3 } #gear:hover, #theme:hover { background:var(--card2) }
  #update div { background:var(--warn-bg); border-bottom:1px solid var(--yellow); padding:3px 6px; display:none }

  main { flex:1; flex-direction: column; min-height:0; padding:4px 6px; overflow:auto }
  main > div:first-child { flex:none; overflow: none; margin-bottom: 4px; }
  #empty { color:var(--dim); padding:4px 0 }
  .cards { display:flex; flex-wrap:wrap; gap:6px; align-content:start }
  .card { width:290px; font-variant-numeric:tabular-nums; background:var(--card); border:1px solid var(--line); padding:3px 5px; display:grid; grid-template-columns:22px 1fr auto; column-gap:5px; row-gap:1px; align-items:center }
  .card.speaking { border-color:var(--green) }
  .avatar { width:22px; height:22px; background:var(--card2); display:grid; place-items:center; font-size:13px; font-weight:700; color:var(--blue) }
  .status, .vol, .acts { grid-column:1 / -1 } .acts:empty { display:none } .acts button { background:var(--card2); border:1px solid var(--line); padding:0 6px; font-size:12px } .acts button:hover { border-color:var(--blue) }
  .card.me .avatar { color:var(--green) }
  .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .name small { color:var(--dim); font-weight:400; font-size:11px; margin-left:4px }
  .status { font-size:12px; color:var(--dim); max-width:100%; line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .status .p { display:inline-block; padding:0 4px; background:var(--card2) }
  .status .p.red { background:var(--alarm-bg); color:var(--red) } .status .p.green { background:var(--on-bg); color:var(--green) } .status .p.yellow { background:var(--warn-bg); color:var(--yellow) }
  .talk { font-size:11px; color:var(--dim); text-align:right }
  .vol { display:flex; align-items:center; gap:4px }
  .vol input { flex:1; min-width:0; accent-color:var(--green); height:14px; margin:0 } .vol span { width:36px; text-align:right; font-size:11px; color:var(--dim) }

  #ctls { display:flex; gap:2px } #switches { display:flex; flex-wrap:wrap; gap:4px; padding:2px 0 }
  .ctl { padding:1px 8px; background:var(--card2); border:1px solid var(--line); display:inline-flex; align-items:baseline; gap:5px; white-space:nowrap }
  .ctl b { font-size:13px; font-weight:600 } .ctl b u { text-decoration:none; color:var(--blue) }
  .ctl small { font-size:11px; color:var(--dim); min-width:2.2em }
  .ctl.on { background:var(--on-bg); border-color:var(--green) } .ctl.on b { color:var(--green) }
  .ctl.alarm { background:var(--alarm-bg); border-color:var(--red) } .ctl.alarm b { color:var(--red) }
  .ctl:hover { filter:brightness(1.15) }

  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(360px,100%); background:var(--card); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .1s; padding:4px 6px; overflow:auto; z-index:5 }
  #drawer.open { transform:none }
  #drawer h2 { margin:0 0 4px; font-size:13px; display:flex; justify-content:space-between; align-items:center; text-transform:uppercase }
  #drawer h3 { margin:6px 0 2px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em }
  select { width:100%; background:var(--card2); color:var(--fg); border:1px solid var(--line); padding:2px 4px; font:inherit }
  .row { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:1px 0 }
  .row button { background:var(--card2); border:1px solid var(--line); padding:0 6px } .row button:hover { border-color:var(--blue) }
  #log { background:var(--bg); border:1px solid var(--line); padding:3px 4px; font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); white-space:pre-wrap; max-height:32vh; overflow:auto }
  #toast { position:fixed; left:50%; top:28px; transform:translateX(-50%); z-index:6; background:var(--card2); border:1px solid var(--line); padding:2px 8px; color:var(--yellow); opacity:0; transition:opacity .15s; pointer-events:none }
  #toast.show { opacity:1 }

  .room { display:flex; flex-direction:column }
  #chat { min-height:160px; flex:1; margin-top:6px }
  #chatbox { flex:1; min-width:0; min-height:0; background:var(--card); display:flex; flex-direction:column }
  #msgs { flex:1; overflow:auto; padding:3px 5px; display:flex; flex-direction:column; gap:0 }
  .msg { line-height:1.3; white-space:pre-wrap; word-break:break-word }
  .msg .t { color:var(--dim); font-size:11px; margin-right:4px } .msg .w { font-weight:600; margin-right:4px } .msg.me .w { color:var(--green) }
  .msg.sys { color:var(--dim) } .msg.sys .w { font-weight:400; font-style:italic }
  #compose { border-top:1px solid var(--line); padding:3px 4px }
  #compose .line { display:flex; align-items:stretch; gap:4px }
  #compose textarea { flex:1; min-width:0; resize:none; background:var(--card2); color:var(--fg); border:1px solid var(--line); padding:2px 4px; font:inherit; min-height:24px; max-height:120px; display:block }
  #compose small { color:var(--dim); font-size:11px }
  #compose label { cursor:pointer; padding:0 6px; display:grid; place-items:center; border:1px solid var(--line); background:var(--card2) } #compose label:hover { border-color:var(--blue) }
  .group { display:flex; gap:6px; padding:4px; border:1px solid var(--line); align-items:stretch; min-width:0 }
  .group > b { flex:none; align-self:center; writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em }
  #people > div { flex:1; min-width:0 }
  #screens { margin-top:6px; overflow-x:auto } #screens:not(:has(.screen)) { display:none }
  .screen { position:relative; flex:none; background:#000; border:1px solid var(--line); cursor:zoom-in }
  .screen canvas { display:block; height:20vh; width:auto } .screen:fullscreen canvas { max-height:100vh; width:100vw; height:100vh; object-fit:contain }
  .screen span { position:absolute; left:4px; top:2px; font-size:11px; color:#fff; background:rgba(0,0,0,.5); padding:0 4px }
  .pic { display:block; max-width:min(100%,420px); max-height:220px; border:1px solid var(--line); margin-top:2px }
  .file { color:var(--blue) }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; place-items:center; z-index:9; cursor:zoom-out }
  #zoom.show { display:grid } #zoom img { max-width:96vw; max-height:96vh }
</style>
</head>
<body>
<header>
  <span class="pill"><code id="link"></code><button onclick="copyLink()">copy</button></span>
  <span id="ctls"></span>
  <span class="spacer"></span>
  <button id="theme" title="light / dark" onclick="flipTheme()">☾</button>
  <button id="gear" title="settings" onclick="drawer.classList.toggle('open')">⚙</button>
</header>
<div id="update"><div id="updateText"></div></div>
<main class="room">
  <div>
    <div id="people" class="group"><b>people</b><div>
      <div id="empty">nobody here yet — send them the link, or join theirs: <input id="joinlink" placeholder="yap://…" size="34"> <button onclick="joinRoom()">join</button></div>
      <div class="cards" id="cards"></div>
    </div></div>
    <div id="screens" class="group"><b>screens</b></div>
  </div>
  <div id="chat" class="group"><b>chat</b><div id="chatbox">
    <div id="msgs"></div>
    <div id="compose"><div class="line"><textarea id="say" rows="1" placeholder="say something…"></textarea><label for="pick" title="send a file">📎</label><input type="file" id="pick" multiple hidden></div><small>enter sends · shift+enter new line · paste or drop files</small></div>
  </div></div>
</main>
<footer>
  <span id="quality"><i></i><span id="qtext">connecting…</span></span>
  <span id="relay"></span>
  <span class="spacer"></span>
  <span class="dim" id="version"></span>
</footer>
<div id="zoom"><img alt=""></div>
<div id="toast"></div>
<aside id="drawer">
  <h2>settings <button onclick="drawer.classList.remove('open')">✕</button></h2>
  <h3>room</h3><div class="row"><input id="joinlink2" placeholder="yap://… to join another room" style="flex:1"><button onclick="joinRoom('joinlink2')">join</button></div>
  <h3>switches</h3><div id="switches"></div>
  <h3>microphone</h3><select id="inputs" onchange="act({Device:{Kind:'in',Name:this.value}})"></select>
  <h3>speakers</h3><select id="outputs" onchange="act({Device:{Kind:'out',Name:this.value}})"></select>
  <h3>bitrate</h3><div class="row"><span><b id="bitrate"></b> kbps</span><span><button onclick="act({Bitrate:-1})">−</button> <button onclick="act({Bitrate:1})">+</button></span></div>
  <h3>echo</h3><div id="knobs"></div>
  <h3>screen share</h3>
  <div class="row"><span>codec</span><select id="sh-codec" style="width:auto" onchange="shareSet('codec',this.value)"><option value="vp8">VP8</option><option value="vp9">VP9 (better, more CPU)</option></select></div>
  <div class="row"><span>size</span><select id="sh-res" style="width:auto" onchange="shareSet('res',this.value)"><option value="480">480p</option><option value="720">720p</option><option value="1080">1080p</option><option value="0">as is</option></select></div>
  <div class="row"><span>frame rate</span><select id="sh-fps" style="width:auto" onchange="shareSet('fps',this.value)"><option>5</option><option>10</option><option>15</option><option>24</option><option>30</option><option>45</option><option>60</option></select></div>
  <div class="row"><span>bitrate</span><select id="sh-kbps" style="width:auto" onchange="shareSet('kbps',this.value)"><option value="1000">1 Mbit/s</option><option value="2500">2.5 Mbit/s</option><option value="5000">5 Mbit/s</option><option value="8000">8 Mbit/s</option><option value="15000">15 Mbit/s</option></select></div>
  <h3>stats</h3><div class="dim" id="stats"></div>
  <h3>log</h3><div id="log"></div>
</aside>
<script>
const $ = id => document.getElementById(id);
// Theme: the saved choice comes with the snapshot; until then the last one
// this browser saw, and failing that the system's. Both dark and light.
const dark = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(t) {
  document.documentElement.dataset.theme = t || (dark.matches ? 'dark' : 'light');
  $('theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '☾';
}
try { applyTheme(localStorage.theme); } catch (e) { applyTheme(''); }
function flipTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.theme = next; } catch (e) {}
  applyTheme(next);
  act({ Theme: next });
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const talk = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

async function act(a) {
  const r = await fetch('/act', { method: 'POST', body: JSON.stringify(a) });
  const { notice } = await r.json();
  if (notice) toast(notice);
}
// press flips a bar button on the spot and holds it until yap confirms,
// so a slow answer never reads as "did not press" (and a second click
// never flips it back by accident).
async function press(b, key) {
  if (b.dataset.want) return;
  const on = !b.classList.contains('on');
  b.dataset.want = String(on);
  b.className = 'ctl ' + (on ? 'on' : '');
  b.lastChild.textContent = '…';
  try { await act({ Key: key }); } catch (e) {}
  setTimeout(() => delete b.dataset.want, 1500); // safety: the snapshot normally clears it sooner
}
let toastT;
function toast(s) { $('toast').textContent = s; $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), 2500); }
function copyLink() { navigator.clipboard.writeText($('link').textContent).then(() => toast('link copied')); }

// levels: instant attack, slow release, per name
const levels = {};
function level(name, db) { const v = Math.max(0, Math.min(1, (db + 50) / 50)), cur = levels[name] || 0; return levels[name] = v >= cur ? v : cur * 0.85; }
// incoming kbps per name from cumulative bytes
const rx = {};
function kbps(p) {
  const now = performance.now(), last = rx[p.Name];
  const k = last ? (p.RxBytes - last.b) * 8 / Math.max(1, now - last.t) : 0;
  rx[p.Name] = { b: p.RxBytes, t: now, k: last ? last.k * 0.8 + k * 0.2 : 0 };
  return rx[p.Name].k;
}

// Cards are built once per person and updated in place, so a slider being
// dragged is never rebuilt under the pointer.
const cards = {};
function card(p, me) {
  let el = cards[p.Name];
  if (!el) {
    el = document.createElement('div');
    el.className = 'card' + (me ? ' me' : '');
    el.innerHTML = `<div class="avatar">${esc((p.Name[0] || '?').toUpperCase())}</div>
      <div class="name">${esc(p.Name)}${me ? ' <small>you</small>' : `<small class="ver"></small>`}</div>
      <div class="status"></div><div class="talk"></div><div class="acts"></div>
      <div class="vol" title="${me ? 'mic gain' : 'volume'}">${me ? '🎤' : ''}<input type="range" min="0" max="${me ? 300 : 200}"><span></span></div>`;
    const r = el.querySelector('input');
    r.addEventListener('pointerdown', () => r.dataset.drag = 1);
    r.addEventListener('input', () => r.nextElementSibling.textContent = r.value + '%');
    r.addEventListener('change', () => { delete r.dataset.drag; act(me ? { MicGain: +r.value } : { Peer: p.Name, Volume: +r.value }); });
    cards[p.Name] = el;
    $('cards').append(el);
  }
  const lv = level(p.Name, p.Level);
  el.classList.toggle('speaking', lv > 0.2);
  el.style.boxShadow = `0 0 0 ${(lv * 4).toFixed(1)}px var(--ring)`;
  el.querySelector('.talk').textContent = talk(p.Talk);
  return el;
}
function pill(text, cls) { return `<span class="p ${cls || ''}">${text}</span>`; }
// status lines carry buttons; rebuild only on change so a click is never lost to a redraw
function setStatus(el, html, sel) { const st = el.querySelector(sel || ".status"); if (st.dataset.h !== html) { st.dataset.h = html; st.innerHTML = html; } }

let ctlKey = '', drawerKey = '';
let themeSeen = '';
function render(s) {
  if (s.Theme !== themeSeen) { themeSeen = s.Theme; if (s.Theme) { applyTheme(s.Theme); try { localStorage.theme = s.Theme; } catch (e) {} } }
  if (s.ShareCfg && s.ShareCfg.codec && Date.now() > shareCfgHold && JSON.stringify(s.ShareCfg) !== shareCfgSeen) { // saved settings (from any browser) into the selects
    shareCfgSeen = JSON.stringify(s.ShareCfg);
    shareCfg = { ...s.ShareCfg }; // the same lower-case keys on both sides
    for (const k of ['codec', 'res', 'fps', 'kbps']) $('sh-' + k).value = shareCfg[k];
  }
  $('link').textContent = s.Link;
  $('version').textContent = s.Version;
  $('updateText').style.display = s.Update ? 'block' : 'none';
  if (s.Update) $('updateText').textContent = `⬆ ${s.Update} is out (you run ${s.Version}) — quit yap and run: yap update`;

  // people
  const people = s.People || [], seen = { [s.Name]: 1 };
  const meEl = card({ Name: s.Name, Level: s.Self.Level, Talk: s.Self.Talk }, true);
  watchers = s.Self.Watchers;
  setStatus(meEl, (share ? pill(`▶ ${share.info || 'sharing'} · ${watchers} watching`, 'green') + ' ' : '') + (s.Self.Muted ? pill('● muted', 'red') : s.Self.PTT ? (s.Self.Talking ? pill('● talking', 'green') : pill('hold space to talk')) : pill(`tx ${s.Bitrate} kbps`)));
  if (s.Self.KeyReq !== keyReqSeen) { keyReqSeen = s.Self.KeyReq; if (share) share.wantKey = true; }
  if (s.Self.SlowReq !== slowReqSeen) { // a viewer is losing frames: back off, then creep back up
    slowReqSeen = s.Self.SlowReq;
    if (share) { share.kbps = Math.max(300, Math.round(share.kbps * 0.7)); share.slowAt = Date.now(); share.w = 0; toast(`viewer losing frames — ${share.kbps} kbit/s`); }
  }
  const mg = meEl.querySelector('input');
  if (!mg.dataset.drag) { mg.value = s.Self.Gain; mg.nextElementSibling.textContent = s.Self.Gain + '%'; }
  let rxAll = 0, rtt = 0, jit = 0, drops = 0, via = 0, bad = 0;
  for (const p of people) {
    seen[p.Name] = 1;
    const k = kbps(p); rxAll += k; rtt = Math.max(rtt, p.RTT); jit = Math.max(jit, p.Jitter);
    drops += p.Lost + p.Stall + p.Skip + p.Rebuf; if (p.Path.startsWith('via')) via++;
    if (p.NoReply || p.CantHear) bad++;
    const el = card(p, false);
    el.querySelector('.ver').textContent = p.Ver;
    let st = pill('connecting…', 'yellow');
    if (p.Connected) {
      st = pill(`${p.Path === 'direct' ? '● direct' : '◐ ' + esc(p.Path)} · ${p.RTT >= 1 ? p.RTT.toFixed(0) + ' ms' : '<1 ms'}${k > 1 ? ' · ' + k.toFixed(0) + ' kbps' : ''}`);
      if (p.NoReply) st = pill(`⚠ no reply ${p.NoReply.toFixed(0)}s`, 'red');
      else if (p.CantHear) st = pill(`⚠ can't hear you`, 'red') + ' ' + st;
      else if (p.Muted) st = pill('muted', 'red') + ' ' + st;
    }
    // the buttons live apart from the live text: rebuilt only when sharing or watching changes
    let acts = '';
    if (p.Sharing) {
      const n = JSON.stringify(p.Name);
      st = pill('▶ sharing', 'green') + ' ' + st;
      acts = (screens[p.Name] ? `<button onclick='unwatch(${n})'>✕ stop</button>` : `<button onclick='watch(${n})'>▶ watch</button>`) + ` <button onclick='pip(${n})'>⧉ pip</button>`;
    } else if (screens[p.Name]) unwatch(p.Name);
    setStatus(el, st);
    setStatus(el, acts, '.acts');
    const r = el.querySelector('input');
    if (!r.dataset.drag) { r.value = p.Volume; r.nextElementSibling.textContent = p.Volume + '%'; }
  }
  for (const name in cards) if (!seen[name]) { cards[name].remove(); delete cards[name]; delete levels[name]; }
  $('empty').style.display = people.length ? 'none' : 'block';

  // header quality
  const q = $('quality').querySelector('i');
  q.className = people.length ? (bad || drops > 50 ? 'poor' : jit > 15 ? 'ok' : 'good') : '';
  $('qtext').textContent = people.length ? `ping ${rtt.toFixed(0).padStart(3)} ms · jitter ${jit.toFixed(1).padStart(4)} ms · ${String(drops).padStart(4)} drops${via ? ` · ${via} via relay` : ''}` : 'no one connected';
  $('relay').innerHTML = (s.Relays || []).map(r => `⇄ relay ${r.Connected ? r.RTT.toFixed(0) + ' ms' : '<span class="yellow">connecting…</span>'}`).join(' · ');
  $('stats').textContent = `tx ${s.Self.Muted ? 0 : s.Bitrate * people.length} kbps · rx ${rxAll.toFixed(0)} kbps · ` + people.map(p => `${p.Name}: lost ${p.Lost} stall ${p.Stall} skip ${p.Skip} rebuf ${p.Rebuf}`).join(' · ');

  // control bar: the buttons are built once (a rebuild under the pointer
  // eats the click); state and the live reading are updated in place
  const ck = s.Toggles.map(t => t.Key + t.Label).join();
  if (ck !== ctlKey) {
    ctlKey = ck;
    const btn = t => {
      const i = t.Label.indexOf(t.Key), label = esc(t.Label.slice(0, i)) + '<u>' + esc(t.Key) + '</u>' + esc(t.Label.slice(i + 1));
      return `<button class="ctl" data-key="${t.Key}" onclick="press(this,'${t.Key}')"><b>${label}</b><small></small></button>`;
    };
    const inBar = t => 'mlp'.includes(t.Key); // the rest lives in the settings drawer
    $('ctls').innerHTML = s.Toggles.filter(inBar).map(btn).join('') + `<button class="ctl" data-key="share" onclick="toggleShare()"><b><u>v</u>ideo</b><small></small></button>`;
