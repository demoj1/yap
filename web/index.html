<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yap</title>
<style>
  :root { --bg:#0f1115; --card:#171a20; --card2:#1e222a; --hover:#2a3039; --line:#272c35; --fg:#e8ebf0; --dim:#8b93a1; --green:#3ddc84; --yellow:#f2c94c; --red:#ff6b6b; --blue:#6cb6ff; --ring:rgba(61,220,132,.55); --on-bg:#173226; --alarm-bg:#3a1d1d; --warn-bg:#3a2e12; --bar-bg:rgba(15,17,21,.92); color-scheme:dark }
  [data-theme=light] { --bg:#f4f6f9; --card:#ffffff; --card2:#eef1f5; --hover:#e2e6ec; --line:#d9dee6; --fg:#1b1f26; --dim:#6b7280; --green:#1a9e5b; --yellow:#b8860b; --red:#d93636; --blue:#1f6fd1; --ring:rgba(26,158,91,.45); --on-bg:#dff5e8; --alarm-bg:#fde2e2; --warn-bg:#fff3cd; --bar-bg:rgba(244,246,249,.92); color-scheme:light }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif; display:flex; flex-direction:column; overflow:hidden }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer }
  .dim { color:var(--dim) } .green { color:var(--green) } .yellow { color:var(--yellow) } .red { color:var(--red) }

  header { padding:4px 6px; display:flex; flex-wrap:wrap; gap:2px 8px; align-items:center; border-bottom:1px solid var(--line); background:var(--card) }
  .pill { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); padding:1px 1px 1px 6px }
  .pill code { font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--blue) }
  .pill button { background:var(--card2); padding:1px 6px; font-size:12px } .pill button:hover { background:var(--hover) }
  #quality { display:inline-flex; align-items:center; gap:5px; color:var(--dim) }
  #quality i { width:8px; height:8px; background:var(--dim); display:inline-block }
  #quality i.good { background:var(--green) } #quality i.ok { background:var(--yellow) } #quality i.poor { background:var(--red) }
  #relay { color:var(--dim) }
  .spacer { flex:1 }
  #gear, #theme { font-size:16px; padding:0 6px; line-height:1.3 } #gear:hover, #theme:hover { background:var(--card2) }
  #update div { background:var(--warn-bg); border-bottom:1px solid var(--yellow); padding:3px 6px; display:none }

  main { flex:1; min-height:0; padding:4px 6px }
  main > div:first-child { overflow:auto; min-height:0; max-height:100% }
  #empty { color:var(--dim); padding:4px 0 }
  .cards { background:var(--card); border:1px solid var(--line) }
  .cards:empty { display:none }
  .card { display:grid; grid-template-columns:24px auto auto 40px 170px; column-gap:6px; padding:2px 4px; align-items:center; border-bottom:1px solid var(--line); min-height:28px }
  .card:last-child { border-bottom:0 }
  .card.speaking { box-shadow:inset 3px 0 var(--green) }
  .avatar { width:24px; height:24px; background:var(--card2); display:grid; place-items:center; font-weight:700; color:var(--blue); box-shadow:0 0 0 0 var(--ring) }
  .card.me .avatar { color:var(--green) }
  .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .name small { color:var(--dim); font-weight:400; font-size:11px; margin-left:4px }
  .status { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .status .p { display:inline-block; padding:0 4px; background:var(--card2) }
  .status .p.red { background:var(--alarm-bg); color:var(--red) } .status .p.green { background:var(--on-bg); color:var(--green) } .status .p.yellow { background:var(--warn-bg); color:var(--yellow) }
  .talk { font-size:11px; color:var(--dim); text-align:right }
  .vol { display:flex; align-items:center; gap:4px }
  .vol input { flex:1; accent-color:var(--green); height:14px; margin:0 } .vol span { width:36px; text-align:right; font-size:11px; color:var(--dim) }
  @media (max-width:700px) { .card { grid-template-columns:32px 1fr 40px; grid-template-rows:auto auto auto } .avatar { grid-row:1 / 4; width:auto; height:auto; align-self:stretch } .talk { grid-column:3; grid-row:1 } .status, .vol { grid-column:2 / -1 } }

  #bar { background:var(--card); border-top:1px solid var(--line); padding:2px }
  #bar .in { display:flex; flex-wrap:wrap; gap:2px }
  .ctl { width:84px; padding:2px 4px; background:var(--card2); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:0 }
  .ctl b { font-size:13px; font-weight:600 } .ctl b u { text-decoration:none; color:var(--blue) }
  .ctl small { font-size:10px; color:var(--dim); min-height:1.2em; white-space:nowrap }
  .ctl.on { background:var(--on-bg); border-color:var(--green) } .ctl.on b { color:var(--green) }
  .ctl.alarm { background:var(--alarm-bg); border-color:var(--red) } .ctl.alarm b { color:var(--red) }
  .ctl:hover { filter:brightness(1.15) }

  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(360px,100%); background:var(--card); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .1s; padding:4px 6px; overflow:auto; z-index:5 }
  #drawer.open { transform:none }
  #drawer h2 { margin:0 0 4px; font-size:13px; display:flex; justify-content:space-between; align-items:center; text-transform:uppercase }
  #drawer h3 { margin:6px 0 2px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em }
  select { width:100%; background:var(--card2); color:var(--fg); border:1px solid var(--line); padding:2px 4px; font:inherit }
  .row { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:1px 0 }
  .row button { background:var(--card2); border:1px solid var(--line); padding:0 6px } .row button:hover { border-color:var(--blue) }
  #log { background:var(--bg); border:1px solid var(--line); padding:3px 4px; font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim); white-space:pre-wrap; max-height:32vh; overflow:auto }
  #toast { position:fixed; left:50%; top:28px; transform:translateX(-50%); z-index:6; background:var(--card2); border:1px solid var(--line); padding:2px 8px; color:var(--yellow); opacity:0; transition:opacity .15s; pointer-events:none }
  #toast.show { opacity:1 }

  .room { display:grid; grid-template-columns:fit-content(60%) minmax(280px,1fr); gap:4px }
  #chat { background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; min-height:0 }
  @media (max-width:700px) { .room { grid-template-columns:1fr; grid-template-rows:auto minmax(120px,1fr) } }
  #msgs { flex:1; overflow:auto; padding:3px 5px; display:flex; flex-direction:column; gap:0 }
  .msg { line-height:1.3; white-space:pre-wrap; word-break:break-word }
  .msg .t { color:var(--dim); font-size:11px; margin-right:4px } .msg .w { font-weight:600; margin-right:4px } .msg.me .w { color:var(--green) }
  .msg.sys { color:var(--dim) } .msg.sys .w { font-weight:400; font-style:italic }
  #compose { border-top:1px solid var(--line); padding:3px 4px }
  #compose textarea { width:100%; resize:none; background:var(--card2); color:var(--fg); border:1px solid var(--line); padding:2px 4px; font:inherit; min-height:24px; max-height:120px; display:block }
  #compose small { color:var(--dim); font-size:11px }
</style>
</head>
<body>
<header>
  <span class="pill"><code id="link"></code><button onclick="copyLink()">copy</button></span>
  <span id="quality"><i></i><span id="qtext">connecting…</span></span>
  <span id="relay"></span>
  <span class="spacer"></span>
  <span class="dim" id="version"></span>
  <button id="theme" title="light / dark" onclick="flipTheme()">☾</button>
  <button id="gear" title="settings" onclick="drawer.classList.toggle('open')">⚙</button>
</header>
<div id="update"><div id="updateText"></div></div>
<main class="room">
  <div>
    <div id="empty">nobody here yet — send them the link</div>
    <div class="cards" id="cards"></div>
  </div>
  <div id="chat">
    <div id="msgs"></div>
    <div id="compose"><textarea id="say" rows="1" placeholder="say something…"></textarea><small>enter sends · shift+enter new line</small></div>
  </div>
</main>
<div id="bar"><div class="in" id="ctls"></div></div>
<div id="toast"></div>
<aside id="drawer">
  <h2>settings <button onclick="drawer.classList.remove('open')">✕</button></h2>
  <h3>microphone</h3><select id="inputs" onchange="act({Device:{Kind:'in',Name:this.value}})"></select>
  <h3>speakers</h3><select id="outputs" onchange="act({Device:{Kind:'out',Name:this.value}})"></select>
  <h3>bitrate</h3><div class="row"><span><b id="bitrate"></b> kbps</span><span><button onclick="act({Bitrate:-1})">−</button> <button onclick="act({Bitrate:1})">+</button></span></div>
  <h3>echo</h3><div id="knobs"></div>
  <h3>stats</h3><div class="dim" id="stats"></div>
  <h3>log</h3><div id="log"></div>
</aside>
<script>
const $ = id => document.getElementById(id);
// Theme: the saved choice comes with the snapshot; until then the last one
// this browser saw, and failing that the system's. Both dark and light.
const dark = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(t) {
  document.documentElement.dataset.theme = t || (dark.matches ? 'dark' : 'light');
  $('theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '☾';
}
try { applyTheme(localStorage.theme); } catch (e) { applyTheme(''); }
function flipTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.theme = next; } catch (e) {}
  applyTheme(next);
  act({ Theme: next });
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const talk = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

async function act(a) {
  const r = await fetch('/act', { method: 'POST', body: JSON.stringify(a) });
  const { notice } = await r.json();
  if (notice) toast(notice);
}
let toastT;
function toast(s) { $('toast').textContent = s; $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), 2500); }
function copyLink() { navigator.clipboard.writeText($('link').textContent).then(() => toast('link copied')); }

// levels: instant attack, slow release, per name
const levels = {};
function level(name, db) { const v = Math.max(0, Math.min(1, (db + 50) / 50)), cur = levels[name] || 0; return levels[name] = v >= cur ? v : cur * 0.85; }
// incoming kbps per name from cumulative bytes
const rx = {};
function kbps(p) {
  const now = performance.now(), last = rx[p.Name];
  const k = last ? (p.RxBytes - last.b) * 8 / Math.max(1, now - last.t) : 0;
  rx[p.Name] = { b: p.RxBytes, t: now, k: last ? last.k * 0.8 + k * 0.2 : 0 };
  return rx[p.Name].k;
}

// Cards are built once per person and updated in place, so a slider being
// dragged is never rebuilt under the pointer.
const cards = {};
function card(p, me) {
  let el = cards[p.Name];
  if (!el) {
    el = document.createElement('div');
    el.className = 'card' + (me ? ' me' : '');
    el.innerHTML = `<div class="avatar">${esc((p.Name[0] || '?').toUpperCase())}</div>
      <div class="name">${esc(p.Name)}${me ? ' <small>you</small>' : `<small class="ver"></small>`}</div>
      <div class="status"></div><div class="talk"></div>` +
      (me ? '' : `<div class="vol"><input type="range" min="0" max="200"><span></span></div>`);
    if (!me) {
      const r = el.querySelector('input');
      r.addEventListener('pointerdown', () => r.dataset.drag = 1);
      r.addEventListener('input', () => r.nextElementSibling.textContent = r.value + '%');
      r.addEventListener('change', () => { delete r.dataset.drag; act({ Peer: p.Name, Volume: +r.value }); });
    }
    cards[p.Name] = el;
    $('cards').append(el);
  }
  const lv = level(p.Name, p.Level);
  el.classList.toggle('speaking', lv > 0.2);
  el.querySelector('.avatar').style.boxShadow = `0 0 0 ${(lv * 6).toFixed(1)}px var(--ring)`;
  el.querySelector('.talk').textContent = talk(p.Talk);
  return el;
}
function pill(text, cls) { return `<span class="p ${cls || ''}">${text}</span>`; }

let ctlKey = '', drawerKey = '';
let themeSeen = '';
function render(s) {
  if (s.Theme !== themeSeen) { themeSeen = s.Theme; if (s.Theme) { applyTheme(s.Theme); try { localStorage.theme = s.Theme; } catch (e) {} } }
  $('link').textContent = s.Link;
  $('version').textContent = s.Version;
  $('updateText').style.display = s.Update ? 'block' : 'none';
  if (s.Update) $('updateText').textContent = `⬆ ${s.Update} is out (you run ${s.Version}) — quit yap and run: yap update`;

  // people
  const people = s.People || [], seen = { [s.Name]: 1 };
  const meEl = card({ Name: s.Name, Level: s.Self.Level, Talk: s.Self.Talk }, true);
  meEl.querySelector('.status').innerHTML = s.Self.Muted ? pill('● muted', 'red') : s.Self.PTT ? (s.Self.Talking ? pill('● talking', 'green') : pill('hold space to talk')) : pill(`tx ${s.Bitrate} kbps`);
  let rxAll = 0, rtt = 0, jit = 0, drops = 0, via = 0, bad = 0;
  for (const p of people) {
    seen[p.Name] = 1;
    const k = kbps(p); rxAll += k; rtt = Math.max(rtt, p.RTT); jit = Math.max(jit, p.Jitter);
    drops += p.Lost + p.Stall + p.Skip + p.Rebuf; if (p.Path.startsWith('via')) via++;
    if (p.NoReply || p.CantHear) bad++;
    const el = card(p, false);
    el.querySelector('.ver').textContent = p.Ver;
    let st = pill('connecting…', 'yellow');
    if (p.Connected) {
      st = pill(`${p.Path === 'direct' ? '● direct' : '◐ ' + esc(p.Path)} · ${p.RTT >= 1 ? p.RTT.toFixed(0) + ' ms' : '<1 ms'}${k > 1 ? ' · ' + k.toFixed(0) + ' kbps' : ''}`);
      if (p.NoReply) st = pill(`⚠ no reply ${p.NoReply.toFixed(0)}s`, 'red');
      else if (p.CantHear) st = pill(`⚠ can't hear you`, 'red') + ' ' + st;
      else if (p.Muted) st = pill('muted', 'red') + ' ' + st;
    }
    el.querySelector('.status').innerHTML = st;
    const r = el.querySelector('input');
    if (!r.dataset.drag) { r.value = p.Volume; r.nextElementSibling.textContent = p.Volume + '%'; }
  }
  for (const name in cards) if (!seen[name]) { cards[name].remove(); delete cards[name]; delete levels[name]; }
  $('empty').style.display = people.length ? 'none' : 'block';

  // header quality
  const q = $('quality').querySelector('i');
  q.className = people.length ? (bad || drops > 50 ? 'poor' : jit > 15 ? 'ok' : 'good') : '';
  $('qtext').textContent = people.length ? `ping ${rtt.toFixed(0)} ms · jitter ${jit.toFixed(1)} ms · ${drops} drops${via ? ` · ${via} via relay` : ''}` : 'no one connected';
  $('relay').innerHTML = (s.Relays || []).map(r => `⇄ relay ${r.Connected ? r.RTT.toFixed(0) + ' ms' : '<span class="yellow">connecting…</span>'}`).join(' · ');
  $('stats').textContent = `tx ${s.Self.Muted ? 0 : s.Bitrate * people.length} kbps · rx ${rxAll.toFixed(0)} kbps · ` + people.map(p => `${p.Name}: lost ${p.Lost} stall ${p.Stall} skip ${p.Skip} rebuf ${p.Rebuf}`).join(' · ');

  // control bar: rebuilt only when something in it changes
  const ck = JSON.stringify(s.Toggles);
  if (ck !== ctlKey) {
    ctlKey = ck;
    $('ctls').innerHTML = s.Toggles.map(t => {
      const i = t.Label.indexOf(t.Key), label = esc(t.Label.slice(0, i)) + '<u>' + esc(t.Key) + '</u>' + esc(t.Label.slice(i + 1));
      const cls = t.On ? 'on' : t.OffRed ? 'alarm' : '';
      const live = t.Key === 'w' ? t.Live.replace(/^.*:/, ':') : t.Live; // the web address fits as its port
      return `<button class="ctl ${cls}" onclick="act({Key:'${t.Key}'})"><b>${label}</b><small>${t.On ? esc(live || 'on') : 'off'}</small></button>`;
    }).join('');
  }
  // drawer: rebuilt only when its contents change
  const dk = JSON.stringify([s.Inputs, s.Outputs, s.Mic, s.Out, s.Bitrate, s.Knobs]);
  if (dk !== drawerKey) {
    drawerKey = dk;
    const opts = (names, cur) => names.map(n => `<option value="${esc(n)}" ${n === cur ? 'selected' : ''}>${esc(n || 'system default')}</option>`).join('');
    $('inputs').innerHTML = opts(s.Inputs || [], s.Mic);
    $('outputs').innerHTML = opts(s.Outputs || [], s.Out);
    $('bitrate').textContent = s.Bitrate;
    $('knobs').innerHTML = s.Knobs.map((k, i) => `<div class="row"><span>${esc(k.Name)}</span><span><button onclick="act({Knob:{I:${i},Dir:-1}})">−</button> ${k.Value} ${k.Unit} <button onclick="act({Knob:{I:${i},Dir:1}})">+</button></span></div>`).join('');
  }
  $('log').textContent = (s.Logs || []).join('\n');
  renderChat(s);
}

// chat: re-rendered only when a message arrives; unread ones count in the tab title
let chatKey = '', unread = 0;
function renderChat(s) {
  const msgs = s.Chat || [], key = msgs.length ? msgs.length + ':' + msgs[msgs.length - 1].At : '0';
  if (key === chatKey) return;
  const grew = chatKey !== '' && msgs.length && msgs[msgs.length - 1].From && msgs[msgs.length - 1].From !== s.Name;
  chatKey = key;
  const box = $('msgs'), stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = msgs.map(m => {
    const t = new Date(m.At).toTimeString().slice(0, 5);
    return `<div class="msg ${m.From ? (m.From === s.Name ? 'me' : '') : 'sys'}"><span class="t">${t}</span><span class="w">${esc(m.From || 'system')}</span>${esc(m.Text)}</div>`;
  }).join('');
  if (stick) box.scrollTop = box.scrollHeight;
  if (grew && document.hidden) { unread++; document.title = `(${unread}) yap`; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { unread = 0; document.title = 'yap'; } });
const say = $('say');
say.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { // shift+enter is a new line
    e.preventDefault();
    const text = say.value;
    if (text.trim()) act({ Chat: text });
    say.value = ''; say.style.height = '';
  }
});
say.addEventListener('input', () => { say.style.height = ''; say.style.height = Math.min(120, say.scrollHeight) + 'px'; });
const drawer = $('drawer');
const es = new EventSource('/events');
es.onmessage = e => render(JSON.parse(e.data));
es.onerror = () => { $('qtext').textContent = 'yap is not running'; $('quality').querySelector('i').className = 'poor'; };
document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === ' ') { act({ Key: ' ' }); e.preventDefault(); }
  else if (/^[mdgealpws]$/.test(e.key)) act({ Key: e.key });
  else if (e.key === 't' || e.key === 'Enter') { say.focus(); e.preventDefault(); }
  else if (e.key === 'Escape') drawer.classList.remove('open');
});
</script>
</body>
</html>
