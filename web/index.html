<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yap</title>
<style>
  :root { --bg:#111418; --card:#191d23; --line:#2a3039; --fg:#e6e9ee; --dim:#7d8590; --green:#3fb950; --yellow:#e3b341; --red:#f85149; --blue:#58a6ff; }
  * { box-sizing:border-box }
  body { margin:0; padding:16px 20px; background:var(--bg); color:var(--fg); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif }
  a { color:var(--blue) }
  .dim { color:var(--dim) } .green { color:var(--green) } .yellow { color:var(--yellow) } .red { color:var(--red) }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:6px }
  header code { font-size:15px; color:var(--blue); font-weight:600 }
  button { background:#22272e; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit }
  button:hover { border-color:var(--blue) }
  #status { color:var(--dim); margin-bottom:12px }
  #update { background:#3a2e12; border:1px solid var(--yellow); border-radius:6px; padding:6px 10px; margin-bottom:10px; display:none }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-bottom:8px }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px }
  .tile.me { border-color:var(--green) }
  .tile.speaking { border-color:var(--green); box-shadow:0 0 0 1px var(--green) inset }
  .tile .head { display:flex; justify-content:space-between; gap:8px; margin-bottom:6px }
  .tile .name { font-weight:600 } .tile.speaking .name { color:var(--green) }
  .meter { height:8px; background:#23282f; border-radius:4px; overflow:hidden; margin:6px 0 }
  .meter i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green) 60%,var(--yellow) 80%,var(--red)); transition:width .08s linear }
  .foot { display:flex; align-items:center; gap:8px; color:var(--dim) }
  input[type=range] { width:120px; accent-color:var(--green) }
  #relays { color:var(--dim); margin:4px 0 10px }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px }
  .chip { display:inline-flex; gap:6px; align-items:center }
  .chip b { font-weight:700 } .chip .sw { color:var(--dim) } .chip.on .sw { color:var(--green) } .chip.off.alarm .sw { color:var(--red) }
  .panels { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; margin-bottom:10px }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px }
  .panel h3 { margin:0 0 6px; font-size:13px; font-weight:600 }
  .panel ul { list-style:none; margin:0; padding:0 } .panel li { padding:3px 0; cursor:pointer; color:var(--dim) } .panel li:hover { color:var(--fg) } .panel li.cur { color:var(--green) }
  .knob { display:flex; justify-content:space-between; align-items:center; padding:3px 0 } .knob span { color:var(--dim) }
  #log { color:var(--dim); white-space:pre-wrap; font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; max-height:40vh; overflow:auto }
  #notice { color:var(--yellow); min-height:1.4em; margin-bottom:6px }
</style>
</head>
<body>
<header>
  <code id="link"></code>
  <button onclick="copyLink()">copy link</button>
  <span class="dim" id="version"></span>
</header>
<div id="update"></div>
<div id="status"></div>
<div class="tiles" id="tiles"></div>
<div id="relays"></div>
<div class="row" id="toggles"></div>
<div class="row">
  <span class="chip"><button onclick="act({Bitrate:-1})">−</button> bitrate <b id="bitrate"></b> kbps <button onclick="act({Bitrate:1})">+</button></span>
</div>
<div class="panels">
  <div class="panel"><h3>input</h3><ul id="inputs"></ul></div>
  <div class="panel"><h3>output</h3><ul id="outputs"></ul></div>
  <div class="panel"><h3>tuning</h3><div id="knobs"></div></div>
</div>
<div id="notice"></div>
<div id="log"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const levels = {}; // smoothed 0..1 per name, instant attack, slow release
function level(name, db) {
  const v = Math.max(0, Math.min(1, (db + 50) / 50)), cur = levels[name] || 0;
  return levels[name] = v >= cur ? v : cur * 0.82;
}
const talk = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const rx = {}; // last RxBytes and time per name, for kbps
function kbps(p) {
  const now = performance.now(), last = rx[p.Name];
  rx[p.Name] = { b: p.RxBytes, t: now, k: last ? (p.RxBytes - last.b) * 8 / Math.max(1, now - last.t) : 0 };
  return last && now - last.t < 2000 ? rx[p.Name].k = (rx[p.Name].k * 0.3 + last.k * 0.7) : 0;
}

async function act(a) {
  const r = await fetch('/act', { method: 'POST', body: JSON.stringify(a) });
  const { notice } = await r.json();
  if (notice) { $('notice').textContent = '▸ ' + notice; setTimeout(() => $('notice').textContent = '', 4000); }
}
function copyLink() { navigator.clipboard.writeText($('link').textContent).then(() => $('notice').textContent = '▸ link copied'); }

let lastKey = '';
function render(s) {
  $('link').textContent = s.Link;
  $('version').textContent = s.Version;
  $('bitrate').textContent = s.Bitrate;
  $('update').style.display = s.Update ? 'block' : 'none';
  if (s.Update) $('update').textContent = `⬆ ${s.Update} available (you run ${s.Version}) — quit and run: yap update`;

  const people = s.People || [];
  let rxAll = 0, rtt = 0, jit = 0, drops = 0, viaRelay = 0;
  const tiles = [selfTile(s)];
  for (const p of people) {
    rxAll += kbps(p); rtt = Math.max(rtt, p.RTT); jit = Math.max(jit, p.Jitter);
    drops += p.Lost + p.Stall + p.Skip + p.Rebuf; if (p.Path.startsWith('via')) viaRelay++;
    tiles.push(peerTile(p));
  }
  $('tiles').innerHTML = tiles.join('');
  $('status').textContent = people.length
    ? `tx ${s.Self.Muted ? 0 : s.Bitrate * people.length} kbps · rx ${rxAll.toFixed(0)} kbps · ping ${rtt.toFixed(0)} ms · jitter ${jit.toFixed(1)} ms · drops ${drops}${viaRelay ? ` · ${viaRelay} via relay` : ''}`
    : 'nobody to talk to yet — send them the link';
  $('relays').innerHTML = (s.Relays || []).map(r => `⇄ <b>${esc(r.Name)}</b> <span class="dim">${esc(r.Ver)} ${r.Connected ? esc(r.Path) + ' · ' + r.RTT.toFixed(0) + ' ms' : 'connecting…'}</span>`).join(' &nbsp; ');

  const key = JSON.stringify([s.Toggles, s.Knobs, s.Inputs, s.Outputs, s.Mic, s.Out]);
  if (key !== lastKey) { // controls only re-render when they change, so clicks are not swallowed
    lastKey = key;
    $('toggles').innerHTML = s.Toggles.map(t => {
      const i = t.Label.indexOf(t.Key), label = esc(t.Label.slice(0, i)) + '<b>' + esc(t.Key) + '</b>' + esc(t.Label.slice(i + 1));
      return `<button class="chip ${t.On ? 'on' : 'off'} ${t.OffRed ? 'alarm' : ''}" onclick="act({Key:'${t.Key}'})"><span>${label}</span><span class="sw">${t.On ? '● on' : '○ off'}</span>${t.Live ? `<span class="dim">${esc(t.Live)}</span>` : ''}</button>`;
    }).join('');
    const list = (id, names, cur, kind) => $(id).innerHTML = names.map(n => `<li class="${n === cur ? 'cur' : ''}" onclick='act({Device:{Kind:"${kind}",Name:${JSON.stringify(n)}}})'>${n === cur ? '● ' : '&nbsp;&nbsp; '}${esc(n || 'default')}</li>`).join('');
    list('inputs', s.Inputs || [], s.Mic, 'in');
    list('outputs', s.Outputs || [], s.Out, 'out');
    $('knobs').innerHTML = s.Knobs.map((k, i) => `<div class="knob"><span>${esc(k.Name)}</span><span><button onclick="act({Knob:{I:${i},Dir:-1}})">◂</button> ${k.Value} ${k.Unit} <button onclick="act({Knob:{I:${i},Dir:1}})">▸</button></span></div>`).join('');
  }
  $('log').textContent = (s.Logs || []).join('\n');
}
function selfTile(s) {
  const lv = level('(you)', s.Self.Level);
  let head = '';
  if (s.Self.Muted) head = '<span class="red">● MUTED</span>';
  else if (s.Self.PTT) head = s.Self.Talking ? '<span class="green">● TALK</span>' : '<span class="dim">○ hold space</span>';
  return `<div class="tile me ${lv > 0.2 ? 'speaking' : ''}"><div class="head"><span class="name">${esc(s.Name)} (you)</span>${head}</div>
    <div class="meter"><i style="width:${lv * 100}%"></i></div><div class="foot"><span>tx ${s.Bitrate} kbps</span><span>${talk(s.Self.Talk)}</span></div></div>`;
}
function peerTile(p) {
  const lv = level(p.Name, p.Level);
  let status = '<span class="yellow">connecting…</span>';
  if (p.Connected) {
    status = `<span class="green">${p.Path === 'direct' ? '●' : '◐'}</span> <span class="dim">${p.RTT >= 1 ? p.RTT.toFixed(0) + ' ms' : '<1 ms'}</span>`;
    if (p.NoReply) status = `<span class="red">⚠ no reply ${p.NoReply.toFixed(0)}s</span>`;
    else if (p.CantHear) status = `<span class="red">⚠ can't hear you</span> ` + status;
    else if (p.Muted) status = `<span class="red">muted</span> ` + status;
  }
  const k = rx[p.Name] ? rx[p.Name].k : 0;
  return `<div class="tile ${lv > 0.2 ? 'speaking' : ''}"><div class="head"><span class="name">${esc(p.Name)} <span class="dim">${esc(p.Ver)}</span></span><span>${status}</span></div>
    <div class="meter"><i style="width:${lv * 100}%"></i></div>
    <div class="foot"><input type="range" min="0" max="200" value="${p.Volume}" oninput="this.nextElementSibling.textContent=this.value+'%'" onchange='act({Peer:${JSON.stringify(p.Name)},Volume:+this.value})'><span>${p.Volume}%</span>${k ? `<span>${k.toFixed(0)} kbps</span>` : ''}<span>${talk(p.Talk)}</span></div></div>`;
}
const es = new EventSource('/events');
es.onmessage = e => render(JSON.parse(e.data));
es.onerror = () => { $('status').textContent = 'yap is not running — close this tab'; };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { act({ Key: ' ' }); e.preventDefault(); }
  else if (/^[mdgealpw]$/.test(e.key)) act({ Key: e.key });
});
</script>
</body>
</html>
